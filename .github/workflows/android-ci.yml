name: Android CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── apicontracts (pure JVM lib) ──
      - name: Test apicontracts
        working-directory: packages/android
        run: ./gradlew :apicontracts:test

      # ── corekit (Android lib: networking / auth / config) ──
      - name: Test corekit
        working-directory: packages/android
        run: ./gradlew :corekit:testDebug

      # ── app (Android application) ──
      - name: Build app (Debug)
        working-directory: packages/android
        run: ./gradlew :app:assembleDebug

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: packages/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
