name: iOS CI

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/ios/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ── ApiContracts Package ──
      - name: Build ApiContracts
        shell: bash
        run: |
          set -o pipefail
          cd packages/ios/ApiContracts
          swift build --configuration debug 2>&1 | tee /tmp/apc-build.log
          build_rc=${PIPESTATUS[0]}
          swift test --configuration debug 2>&1 | tee /tmp/apc-test.log
          test_rc=${PIPESTATUS[0]}
          rc=0
          if [ "$build_rc" -ne 0 ] || [ "$test_rc" -ne 0 ]; then rc=1; fi
          if [ "$rc" -ne 0 ]; then
            cat /tmp/apc-build.log /tmp/apc-test.log \
              | grep -E 'error:|warning:|FAILED|BUILD FAILED|Test Case.*failed|XCTAssert|Fatal error|Unhandled' \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done \
              | head -80
          fi
          exit "$rc"

      # ── CoreKit Package ──
      - name: Build CoreKit
        shell: bash
        run: |
          set -o pipefail
          cd packages/ios/CoreKit
          swift build --configuration debug 2>&1 | tee /tmp/core-build.log
          build_rc=${PIPESTATUS[0]}
          swift test --configuration debug 2>&1 | tee /tmp/core-test.log
          test_rc=${PIPESTATUS[0]}
          rc=0
          if [ "$build_rc" -ne 0 ] || [ "$test_rc" -ne 0 ]; then rc=1; fi
          if [ "$rc" -ne 0 ]; then
            cat /tmp/core-build.log /tmp/core-test.log \
              | grep -E 'error:|warning:|FAILED|BUILD FAILED|Test Case.*failed|XCTAssert|Fatal error|Unhandled' \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done \
              | head -80
          fi
          exit "$rc"

      # ── ios-gaokao (single high-school app target; directory name retained) ──
      - name: Generate ios-gaokao.xcodeproj
        shell: bash
        run: |
          set -o pipefail
          { brew install xcodegen; } 2>&1 | tee /tmp/xcodegen-brew.log
          brew_rc=${PIPESTATUS[0]}
          cd packages/ios/ios-gaokao
          { xcodegen generate --spec project.yml; } 2>&1 | tee /tmp/xcodegen.log
          gen_rc=${PIPESTATUS[0]}
          if [ "$brew_rc" -ne 0 ] || [ "$gen_rc" -ne 0 ]; then
            cat /tmp/xcodegen-brew.log /tmp/xcodegen.log \
              | grep -E 'error|Error|failed|Failed|not found|No such|Usage|brew' \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done \
              | head -60
            exit 1
          fi

      - name: Build ios-gaokao (Debug)
        shell: bash
        run: |
          set -o pipefail
          { xcodebuild build \
              -project packages/ios/ios-gaokao/ios-gaokao.xcodeproj \
              -target ios-gaokao \
              -configuration Debug \
              -sdk iphonesimulator \
              CODE_SIGNING_ALLOWED=NO; } 2>&1 | tee /tmp/app-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E 'error:|warning:|BUILD FAILED|fatal|not found|No such' /tmp/app-build.log \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done \
              | head -80
            exit 1
          fi

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            DerivedData/Logs/
            packages/ios/ios-gaokao/*.log
            /tmp/apc-build.log
            /tmp/apc-test.log
            /tmp/core-build.log
            /tmp/core-test.log
            /tmp/xcodegen-brew.log
            /tmp/xcodegen.log
            /tmp/app-build.log
          retention-days: 3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('packages/ios/ios-gaokao/project.yml'))"
          echo "YAML syntax OK"
