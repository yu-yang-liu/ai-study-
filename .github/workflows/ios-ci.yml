name: iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "packages/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/ios/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ios-ci.yml') }}
          restore-keys: homebrew-${{ runner.os }}-

      - name: Cache SwiftPM build (ApiContracts/CoreKit)
        uses: actions/cache@v4
        with:
          path: |
            packages/ios/ApiContracts/.build
            packages/ios/CoreKit/.build
          key: spm-ios-${{ runner.os }}-${{ hashFiles('packages/ios/ApiContracts/Package.swift', 'packages/ios/CoreKit/Package.swift') }}
          restore-keys: spm-ios-${{ runner.os }}-

      - name: Cache Xcode SPM checkouts (ios-gaokao)
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('packages/ios/ios-gaokao/project.yml') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ── ApiContracts Package ──
      - name: Build ApiContracts
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ios/ApiContracts
          swift build --configuration debug 2>&1 | tee /tmp/apc-build.log
          swift test --configuration debug 2>&1 | tee /tmp/apc-test.log

      # ── CoreKit Package ──
      - name: Build CoreKit
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ios/CoreKit
          swift build --configuration debug 2>&1 | tee /tmp/core-build.log
          swift test --configuration debug 2>&1 | tee /tmp/core-test.log

      # ── ios-gaokao (single high-school app target; directory name retained) ──
      - name: Generate ios-gaokao.xcodeproj
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen 2>&1 | tee /tmp/xcodegen-brew.log
          cd packages/ios/ios-gaokao
          xcodegen generate --spec project.yml 2>&1 | tee /tmp/xcodegen.log

      - name: Build ios-gaokao (Debug)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
              -project packages/ios/ios-gaokao/ios-gaokao.xcodeproj \
              -scheme ios-gaokao \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath DerivedData \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/app-build.log

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            DerivedData/Logs/
            packages/ios/ios-gaokao/*.log
            /tmp/apc-build.log
            /tmp/apc-test.log
            /tmp/core-build.log
            /tmp/core-test.log
            /tmp/xcodegen-brew.log
            /tmp/xcodegen.log
            /tmp/app-build.log
          retention-days: 3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('packages/ios/ios-gaokao/project.yml'))"
          echo "YAML syntax OK"
