name: iOS CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "packages/ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/ios/**"
      - ".github/workflows/ios-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew (xcodegen)
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-${{ runner.os }}-${{ hashFiles('.github/workflows/ios-ci.yml') }}
          restore-keys: homebrew-${{ runner.os }}-

      - name: Cache SwiftPM build (ApiContracts/CoreKit)
        uses: actions/cache@v4
        with:
          path: |
            packages/ios/ApiContracts/.build
            packages/ios/CoreKit/.build
          key: spm-ios-${{ runner.os }}-${{ hashFiles('packages/ios/ApiContracts/Package.swift', 'packages/ios/CoreKit/Package.swift') }}
          restore-keys: spm-ios-${{ runner.os }}-

      - name: Cache Xcode SPM checkouts (ios-gaokao)
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: xcode-spm-${{ runner.os }}-${{ hashFiles('packages/ios/ios-gaokao/project.yml') }}
          restore-keys: xcode-spm-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      # ── ApiContracts Package ──
      - name: Build ApiContracts
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ios/ApiContracts
          swift build --configuration debug 2>&1 | tee /tmp/apc-build.log
          swift test --configuration debug --disable-swift-testing 2>&1 | tee /tmp/apc-test.log

      # ── CoreKit Package ──
      - name: Build CoreKit
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ios/CoreKit
          swift build --configuration debug 2>&1 | tee /tmp/core-build.log
          swift test --configuration debug --disable-swift-testing 2>&1 | tee /tmp/core-test.log

      # ── ios-gaokao (single high-school app target; directory name retained) ──
      - name: Generate ios-gaokao.xcodeproj
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen 2>&1 | tee /tmp/xcodegen-brew.log
          cd packages/ios/ios-gaokao
          xcodegen generate --spec project.yml 2>&1 | tee /tmp/xcodegen.log

      - name: Validate Staging build settings
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AISTUDY_API_BASE_URL_STAGING: ${{ secrets.AISTUDY_API_BASE_URL_STAGING }}
          AISTUDY_DEVELOPMENT_TEAM: ${{ secrets.AISTUDY_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          bash packages/ios/ios-gaokao/Config/validate-build-settings.sh staging --require-team

      - name: Build ios-gaokao (Staging)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          AISTUDY_API_BASE_URL_STAGING: ${{ secrets.AISTUDY_API_BASE_URL_STAGING }}
          AISTUDY_DEVELOPMENT_TEAM: ${{ secrets.AISTUDY_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          xcodebuild build \
              -project packages/ios/ios-gaokao/ios-gaokao.xcodeproj \
              -scheme ios-gaokao \
              -configuration Staging \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath DerivedData \
              AISTUDY_API_BASE_URL_STAGING="$AISTUDY_API_BASE_URL_STAGING" \
              AISTUDY_DEVELOPMENT_TEAM="$AISTUDY_DEVELOPMENT_TEAM" \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/app-staging-build.log

      - name: Build ios-gaokao (Debug)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
              -project packages/ios/ios-gaokao/ios-gaokao.xcodeproj \
              -scheme ios-gaokao \
              -configuration Debug \
              -destination "generic/platform=iOS Simulator" \
              -derivedDataPath DerivedData \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/app-build.log

      - name: Test ios-gaokao (Debug)
        shell: bash
        run: |
          set -euo pipefail
          destination_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')"
          test -n "${destination_id}" || {
            echo "No available iPhone Simulator found"
            xcrun simctl list devices available
            exit 1
          }
          xcodebuild test \
              -project packages/ios/ios-gaokao/ios-gaokao.xcodeproj \
              -scheme ios-gaokao \
              -configuration Debug \
              -destination "id=${destination_id}" \
              -derivedDataPath DerivedData \
              CODE_SIGNING_ALLOWED=NO 2>&1 | tee /tmp/app-test.log

      - name: Archive ios-gaokao (unsigned Release)
        shell: bash
        env:
          AISTUDY_API_BASE_URL_PRODUCTION: ${{ secrets.AISTUDY_API_BASE_URL_PRODUCTION }}
          AISTUDY_DEVELOPMENT_TEAM: ${{ secrets.AISTUDY_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail
          bash packages/ios/ios-gaokao/Config/validate-build-settings.sh production --require-team
          xcodebuild archive \
              -project packages/ios/ios-gaokao/ios-gaokao.xcodeproj \
              -scheme ios-gaokao \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$RUNNER_TEMP/ios-gaokao.xcarchive" \
              -derivedDataPath DerivedData \
              AISTUDY_API_BASE_URL_PRODUCTION="$AISTUDY_API_BASE_URL_PRODUCTION" \
              AISTUDY_DEVELOPMENT_TEAM="$AISTUDY_DEVELOPMENT_TEAM" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO 2>&1 | tee /tmp/app-archive.log

      - name: Verify archived environment metadata
        shell: bash
        env:
          AISTUDY_API_BASE_URL_PRODUCTION: ${{ secrets.AISTUDY_API_BASE_URL_PRODUCTION }}
        run: |
          set -euo pipefail
          app_plist="$(find "$RUNNER_TEMP/ios-gaokao.xcarchive/Products/Applications" -name Info.plist -print -quit)"
          test -n "$app_plist"
          environment="$(/usr/libexec/PlistBuddy -c 'Print :API_ENVIRONMENT' "$app_plist")"
          api_url="$(/usr/libexec/PlistBuddy -c 'Print :API_BASE_URL' "$app_plist")"
          test "$environment" = "production"
          test "$api_url" = "$AISTUDY_API_BASE_URL_PRODUCTION"
          ! printf '%s' "$api_url" | grep -Eiq 'example\.com|xxx\.vercel\.app|\$\('

      - name: Upload unsigned archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-gaokao-unsigned-archive
          path: ${{ runner.temp }}/ios-gaokao.xcarchive
          retention-days: 3

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            DerivedData/Logs/
            packages/ios/ios-gaokao/*.log
            /tmp/apc-build.log
            /tmp/apc-test.log
            /tmp/core-build.log
            /tmp/core-test.log
            /tmp/xcodegen-brew.log
            /tmp/xcodegen.log
            /tmp/app-build.log
            /tmp/app-staging-build.log
            /tmp/app-test.log
            /tmp/app-archive.log
          retention-days: 3

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check YAML syntax
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/ios-ci.yml')"
          ruby -e "require 'yaml'; YAML.load_file('packages/ios/ios-gaokao/project.yml')"
          echo "YAML syntax OK"
