# XcodeGen 项目规范 — ios-gaokao（目录名保留，单高中端）
# 在 Mac 上运行: xcodegen generate --spec project.yml && open ios-gaokao.xcodeproj
# 安装: brew install xcodegen

name: ios-gaokao

options:
  bundleIdPrefix: com.aistudy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  generateEmptyDirectories: true
  defaultConfig: Release
  fileTypes:
    xcassets: folder
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.aistudy.app
    INFOPLIST_FILE: Resources/Info.plist
    SWIFT_VERSION: "6.0"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: GAOKAO
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
  configs:
    Debug:
      API_BASE_URL: https://api-dev.example.com
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      API_BASE_URL: https://api.example.com
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  ApiContracts:
    path: ../ApiContracts
  CoreKit:
    path: ../CoreKit

targets:
  ios-gaokao:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: CoreKit
    preBuildScripts:
      - name: "SwiftLint"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --config ../../.swiftlint.yml 2>/dev/null || true
          fi
        basedOnDependencyAnalysis: false
        inputFiles: []
        outputFiles: []
    postBuildScripts:
      - name: "Strip Simulator Architectures (Release)"
        script: |
          if [[ "$CONFIGURATION" == "Release" ]]; then
            bash "${BUILDROOT}/../../SourcePackages/checkouts/ios-strip-archs.sh" "${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}" || true
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: AI高中助手
        DISPLAY_NAME: AI高中助手
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: false
        CLANG_ENABLE_MODULES: true
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_MODULE_VERIFIER: true
        OTHER_SWIFT_FLAGS: "$(inherited) -D GAOKAO"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
          ENABLE_STRICT_OBJC_MSGSEND: true
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
          VALIDATE_PRODUCT: true

schemes:
  ios-gaokao:
    build:
      targets:
        ios-gaokao: all
    run:
      config: Debug
      disableMainThreadChecker: false
      stopOnEveryMainThreadCheckerIssue: true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      customArchiveName: ios-gaokao
